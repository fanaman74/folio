[package]
name = "folio-desktop"
version = "0.1.0"
description = "Folio desktop: convert files to PDF on your own computer"
authors = ["Folio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
# PDF writing and merging
lopdf = "0.47"
genpdf = "0.2"
# Input readers
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "tga", "pnm", "qoi"] }
flate2 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
csv = "1"
calamine = { version = "0.38", features = ["dates"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
html2text = "0.17"
subsetter = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
